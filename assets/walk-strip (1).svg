<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="Two developers walk together, one carrying coffee and one a laptop, while colorful balls bounce along the path" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A1B27"/>
      <stop offset=".5" stop-color="#24283B"/>
      <stop offset="1" stop-color="#1A1B27"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="120" rx="16"/></clipPath>
    <g id="cupbody">
      <path d="M0 4h26v14a10 10 0 0 1-10 10h-6A10 10 0 0 1 0 18z" fill="#E2E8F0"/>
      <path d="M26 8h3a6 6 0 0 1 0 12h-3" fill="none" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="13" cy="4" rx="13" ry="3.4" fill="#8B5A2B"/>
    </g>
  </defs>

  <style>
    .tw{animation:tw 3s ease-in-out infinite alternate}
    @keyframes tw{from{opacity:.15}to{opacity:.9}}

    .path{stroke-dasharray:6 10;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-16}}

    .bounce{transform-box:fill-box;transform-origin:center bottom;animation:bounce 1.2s infinite}
    @keyframes bounce{0%{transform:translateY(0);animation-timing-function:ease-out}50%{transform:translateY(-46px);animation-timing-function:ease-in}100%{transform:translateY(0)}}

    .walk{animation:cross 18s linear infinite both}
    @keyframes cross{from{transform:translateX(-540px)}to{transform:translateX(540px)}}

    .bob{animation:bob .4s ease-in-out infinite alternate}
    @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}

    .part{transform-box:fill-box;transform-origin:50% 0%}
    .s1{animation:swing .8s ease-in-out infinite alternate}
    .s2{animation:swing .8s ease-in-out infinite alternate-reverse}
    @keyframes swing{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}

    .steam{fill:none;stroke:#94A3B8;stroke-width:3;stroke-linecap:round;animation:steam 2s ease-in-out infinite}
    @keyframes steam{0%{opacity:0;transform:translateY(3px)}50%{opacity:.85}100%{opacity:0;transform:translateY(-6px)}}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="120" fill="url(#bg)"/>

    <!-- twinkling dots -->
    <circle class="tw" cx="60" cy="24" r="1.8" fill="#70A5FD"/>
    <circle class="tw" style="animation-delay:-1s" cx="150" cy="50" r="1.4" fill="#A78BFA"/>
    <circle class="tw" style="animation-delay:-2s" cx="260" cy="20" r="1.8" fill="#70A5FD"/>
    <circle class="tw" style="animation-delay:-.5s" cx="380" cy="44" r="1.4" fill="#34D399"/>
    <circle class="tw" style="animation-delay:-1.5s" cx="470" cy="16" r="1.8" fill="#70A5FD"/>
    <circle class="tw" style="animation-delay:-2.5s" cx="590" cy="38" r="1.4" fill="#F59E0B"/>
    <circle class="tw" style="animation-delay:-.8s" cx="700" cy="22" r="1.8" fill="#70A5FD"/>
    <circle class="tw" style="animation-delay:-1.8s" cx="810" cy="48" r="1.4" fill="#A78BFA"/>
    <circle class="tw" style="animation-delay:-2.2s" cx="860" cy="18" r="1.8" fill="#70A5FD"/>

    <!-- path -->
    <line class="path" x1="0" y1="102" x2="900" y2="102" stroke="#3B4261" stroke-width="2"/>

    <!-- bouncing balls -->
    <circle class="bounce" cx="170" cy="93" r="8" fill="#F59E0B"/>
    <circle class="bounce" style="animation-delay:-.4s" cx="400" cy="94" r="7" fill="#70A5FD"/>
    <circle class="bounce" style="animation-delay:-.8s" cx="640" cy="93" r="8" fill="#34D399"/>
    <circle class="bounce" style="animation-delay:-.2s" cx="800" cy="95" r="6" fill="#A78BFA"/>

    <!-- walker 1: coffee -->
    <g class="walk">
      <g transform="translate(450 100)">
        <ellipse cx="0" cy="2" rx="15" ry="3" fill="#000000" opacity=".28"/>
        <g class="bob">
          <rect class="part s2" x="-3" y="-52" width="6" height="22" rx="3" fill="#2563EB"/>
          <rect class="part s2" x="-4" y="-30" width="8" height="30" rx="4" fill="#1E3A8A"/>
          <rect class="part s1" x="-4" y="-30" width="8" height="30" rx="4" fill="#1E40AF"/>
          <rect x="-10" y="-56" width="20" height="30" rx="9" fill="#3B82F6"/>
          <circle cx="0" cy="-68" r="10" fill="#F1C9A5"/>
          <path d="M-10 -70a10 10 0 0 1 20 0q-10-7-20 0z" fill="#2B2230"/>
          <circle cx="4" cy="-67" r="1.6" fill="#1A1B27"/>
          <g transform="rotate(-80 0 -50)"><rect x="-3" y="-50" width="6" height="22" rx="3" fill="#3B82F6"/></g>
          <circle cx="22" cy="-46" r="3.6" fill="#F1C9A5"/>
          <g transform="translate(19 -60) scale(.55)">
            <use href="#cupbody"/>
            <path class="steam" d="M8 0q-5-7 0-13"/>
            <path class="steam" style="animation-delay:.7s" d="M17 0q-5-7 0-13"/>
          </g>
        </g>
      </g>
    </g>

    <!-- walker 2: laptop -->
    <g class="walk">
      <g transform="translate(385 100)">
        <ellipse cx="0" cy="2" rx="15" ry="3" fill="#000000" opacity=".28"/>
        <g class="bob" style="animation-delay:-.2s">
          <rect class="part s1" x="-3" y="-52" width="6" height="22" rx="3" fill="#8B5CF6"/>
          <rect class="part s1" x="-4" y="-30" width="8" height="30" rx="4" fill="#312E81"/>
          <rect class="part s2" x="-4" y="-30" width="8" height="30" rx="4" fill="#3730A3"/>
          <rect x="-10" y="-56" width="20" height="30" rx="9" fill="#A78BFA"/>
          <circle cx="0" cy="-68" r="10" fill="#C68642"/>
          <path d="M-10 -72a10 10 0 0 1 20 0q-10-5-20 0z" fill="#1F2937"/>
          <circle cx="4" cy="-67" r="1.6" fill="#1A1B27"/>
          <g transform="rotate(-80 0 -50)"><rect x="-3" y="-50" width="6" height="22" rx="3" fill="#A78BFA"/></g>
          <circle cx="22" cy="-46" r="3.6" fill="#C68642"/>
          <rect x="9" y="-60" width="22" height="14" rx="2.5" fill="#475569"/>
          <rect x="9" y="-47" width="22" height="2.4" rx="1.2" fill="#94A3B8"/>
          <circle cx="20" cy="-53" r="2" fill="#F59E0B"/>
        </g>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
